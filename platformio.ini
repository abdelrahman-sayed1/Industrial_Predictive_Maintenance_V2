[env:lolin32-lite]
platform = espressif32
board = lolin32_lite
framework = arduino
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.4
    milesburton/DallasTemperature@^3.11.0
    paulstoffregen/OneWire@^2.3.7
    bblanchon/ArduinoJson@^6.21.3
    knolleary/PubSubClient@^2.8
    WiFi
